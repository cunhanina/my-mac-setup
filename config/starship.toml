"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false

format = "$os$directory$git_branch$git_status$nodejs$rust$golang$php $character"

[os]
disabled = false
format = "[$symbol](#8be9fd) "

[os.symbols]
Macos   = ""
Ubuntu  = ""
Arch    = ""
Artix   = ""

[directory]
format            = "[$path](#ff79c6) "
truncation_length = 4
truncate_to_repo  = true

[git_branch]
symbol = ""
format = "[$symbol $branch](#bd93f9) "

[git_status]
format     = "([$ahead_behind$staged$modified$untracked$deleted$conflicted](#ff79c6) )"
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇡${ahead_count}⇣${behind_count} "
staged     = "+${count} "
modified   = "●${count} "
untracked  = "?${count} "
deleted    = "✘${count} "
conflicted = "⚡${count} "

[nodejs]
symbol = ""
format = "[$symbol $version](#bd93f9) "

[rust]
symbol = ""
format = "[$symbol $version](#ff79c6) "

[golang]
symbol = ""
format = "[$symbol $version](#8be9fd) "

[php]
symbol = ""
format = "[$symbol $version](#bd93f9) "

[character]
success_symbol = "[❯](#8be9fd)"
error_symbol   = "[❯](#ff5555)"
vimcmd_symbol  = "[❮](#bd93f9)"